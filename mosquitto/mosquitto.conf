# Mosquitto MQTT Broker — CGH SCADA
# Documentação: https://mosquitto.org/man/mosquitto-conf-5.html

listener 1883
allow_anonymous true

# Para autenticação por senha, comente a linha acima e descomente:
# password_file /mosquitto/config/passwd

# Log
log_type error
log_type warning
log_type information
log_dest stdout

# Persistência (opcional)
persistence true
persistence_location /mosquitto/data/

# WebSocket (para integração com browsers, opcional)
listener 9001
protocol websockets
allow_anonymous true
